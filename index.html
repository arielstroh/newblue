<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NewBlue — Live Broadcast Graphics</title>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#0f1626; --panel:#131c30; --panel2:#18233d;
    --line:#243352; --ink:#eaf1ff; --muted:#9db0d4; --dim:#6b7ea6;
    --brand:#2e8bff; --brand2:#00d0ff; --accent:#5b6cff; --good:#28d3a0; --warn:#ff5d6c;
    --grad:linear-gradient(135deg,#2e8bff 0%,#00d0ff 100%);
    --radius:16px; --shadow:0 20px 60px rgba(0,0,0,.45);
    --maxw:1200px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 80% -10%,#16233f 0%,var(--bg) 55%) fixed,var(--bg);
    color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(14px);background:rgba(10,14,26,.78);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:18px;
    padding:14px 22px}
  .brand-logo{height:40px;width:auto;flex-shrink:0}
  .partner-logo{height:36px;width:auto;flex-shrink:0;opacity:.95;margin-left:4px}
  nav{display:flex;gap:4px;margin-left:14px;flex:1;flex-wrap:wrap}
  nav button{
    background:transparent;border:0;color:var(--muted);font:inherit;font-weight:600;
    font-size:15px;padding:9px 14px;border-radius:10px;cursor:pointer;transition:.18s;white-space:nowrap}
  nav button:hover{color:var(--ink);background:var(--panel)}
  nav button.active{color:#fff;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
  .lang{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .lang button{background:transparent;border:0;color:var(--muted);font:inherit;font-weight:700;
    font-size:13px;padding:8px 12px;cursor:pointer;transition:.15s}
  .lang button.active{background:var(--grad);color:#03203f}

  /* ---------- Layout ---------- */
  main{max-width:var(--maxw);margin:0 auto;padding:34px 22px 90px}
  .page{display:none;animation:fade .45s ease}
  .page.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{color:var(--brand2);font-weight:800;letter-spacing:2px;font-size:12px;text-transform:uppercase}
  h1{font-size:clamp(30px,4.4vw,52px);line-height:1.08;letter-spacing:-1px;margin:10px 0 14px;font-weight:850}
  h2{font-size:clamp(22px,2.8vw,32px);letter-spacing:-.5px;margin:0 0 6px;font-weight:800}
  h3{font-size:19px;font-weight:750;margin:0 0 6px}
  .lead{font-size:clamp(16px,1.9vw,20px);color:var(--muted);max-width:70ch}
  .section{margin-top:44px}
  .grad-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:750;font-size:16px;
    padding:13px 22px;border-radius:12px;cursor:pointer;border:0;transition:.18s;background:var(--grad);
    color:#03203f;box-shadow:0 10px 26px rgba(46,139,255,.35)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(46,139,255,.5)}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
  .btn.ghost:hover{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--brand)}
  .cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}

  /* ---------- Cards & grid ---------- */
  .grid{display:grid;gap:18px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .card{background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
    border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:.2s}
  .card:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--shadow)}
  .card .ico{width:46px;height:46px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;
    font-size:24px;margin-bottom:14px;box-shadow:inset 0 0 0 1px var(--line)}
  .card p{color:var(--muted);font-size:15px}
  .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.4px;padding:4px 10px;border-radius:99px;
    background:rgba(46,139,255,.15);color:var(--brand2);border:1px solid rgba(46,139,255,.35);margin-bottom:12px}

  /* ---------- Hero ---------- */
  .hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);
    background:linear-gradient(120deg,#0d1730 0%,#0a0e1a 60%);padding:48px}
  .hero .glow{position:absolute;inset:auto -10% -40% auto;width:520px;height:520px;
    background:radial-gradient(circle,rgba(0,208,255,.28),transparent 60%);filter:blur(20px);pointer-events:none}
  .hero-inner{position:relative;max-width:760px}
  .pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
  .pill{font-size:13px;font-weight:700;color:var(--muted);padding:8px 14px;border:1px solid var(--line);
    border-radius:99px;background:rgba(255,255,255,.02)}
  .stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:34px}
  .stat b{display:block;font-size:30px;font-weight:850}
  .stat span{color:var(--dim);font-size:13px;font-weight:600}
  .hero-art{position:absolute;right:34px;top:50%;transform:translateY(-50%);width:360px;max-width:36%;opacity:.95;pointer-events:none}
  .hero-art .bar{transform-box:fill-box;transform-origin:bottom;animation:barpulse 2.6s ease-in-out infinite}
  @keyframes barpulse{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
  @media(max-width:860px){.hero-art{display:none}}

  /* "any production" spectrum + use-case tiles */
  .scale-bar{display:flex;align-items:center;gap:14px;margin:18px 0 22px}
  .scale-bar span{font-size:12.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);white-space:nowrap;text-transform:uppercase}
  .scale-bar i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#5b6cff,#2e8bff,#00d0ff)}
  .uc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
  .usecase{display:flex;gap:13px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:16px;transition:.2s}
  .usecase:hover{border-color:var(--brand);transform:translateY(-2px)}
  .usecase .uc-ic{width:44px;height:44px;flex-shrink:0;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 0 0 1px var(--line)}
  .usecase h3{font-size:15px;margin:0 0 3px}
  .usecase p{color:var(--muted);font-size:13px;margin:0;line-height:1.45}

  /* home image gallery */
  .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  @media(max-width:800px){.shots{grid-template-columns:1fr}}
  .shot{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--panel),var(--bg2));aspect-ratio:16/10}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .shot.hw{background:linear-gradient(180deg,#e9eef6,#cdd9ea)}
  .shot.hw img{object-fit:contain;padding:18px}
  .shot figcaption{position:absolute;left:0;right:0;bottom:0;padding:12px 13px;font-size:12.5px;font-weight:650;color:#fff;background:linear-gradient(0deg,rgba(5,7,14,.9),rgba(5,7,14,0))}
  .shot.ph img{display:none}
  .shot.ph:before{content:attr(data-ph);position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--dim);font-size:13px;font-weight:600}

  /* ---------- Video ---------- */
  .video{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#05070e;aspect-ratio:16/9}
  .video video{width:100%;height:100%;object-fit:cover;display:block}
  .video .poster{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;
    background:linear-gradient(135deg,#12203c,#0a0e1a);text-align:center}
  .video .poster .play{width:74px;height:74px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
    font-size:30px;color:#03203f;box-shadow:0 12px 30px rgba(0,208,255,.5);margin-bottom:10px;transition:.2s}
  .video .poster:hover .play{transform:scale(1.08)}
  .video .poster small{color:var(--dim);font-weight:600}
  .video .poster .lbl{color:var(--muted);font-weight:700;font-size:15px;margin-top:4px}

  /* ---------- Architecture toggle ---------- */
  .switch{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;gap:5px;margin:8px 0 26px}
  .switch button{background:transparent;border:0;color:var(--muted);font:inherit;font-weight:750;font-size:15px;
    padding:11px 20px;border-radius:9px;cursor:pointer;transition:.18s}
  .switch button.active{background:var(--grad);color:#03203f}
  .arch{display:none}.arch.show{display:block;animation:fade .4s ease}
  .flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
  .node{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
  .node .ni{font-size:26px;margin-bottom:8px}
  .node b{display:block;margin-bottom:2px}
  .node small{color:var(--dim);font-size:12.5px}
  .arrow{display:grid;place-items:center;color:var(--brand2);font-size:26px;padding:0 6px;font-weight:800}
  .node.hl{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),0 12px 30px rgba(46,139,255,.25);
    background:linear-gradient(180deg,#14233f,#0f1830)}

  /* ---------- Pricing ---------- */
  .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .price{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:26px;position:relative}
  .price.feat{border-color:var(--brand);box-shadow:0 20px 50px rgba(46,139,255,.22)}
  .price.feat:before{content:attr(data-badge);position:absolute;top:-12px;left:50%;transform:translateX(-50%);
    background:var(--grad);color:#03203f;font-size:12px;font-weight:800;padding:5px 14px;border-radius:99px;white-space:nowrap}
  .price .amt{font-size:38px;font-weight:850;margin:8px 0 2px}
  .price .amt small{font-size:15px;color:var(--dim);font-weight:600}
  .price ul{list-style:none;margin:16px 0 20px;display:grid;gap:9px}
  .price li{color:var(--muted);font-size:14.5px;padding-left:24px;position:relative}
  .price li:before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:900}
  .note{color:var(--dim);font-size:13px;margin-top:18px}
  .hw-img{width:100%;height:auto;margin-bottom:12px;background:transparent}
  .incl-banner{margin-top:14px;padding:12px 16px;border:1px solid var(--brand);border-radius:12px;
    background:rgba(46,139,255,.1);color:var(--ink);font-size:14.5px;font-weight:600}
  .price li.incl{color:var(--brand2);font-weight:700}
  .price li.incl:before{content:"★";color:var(--brand2)}

  /* ---------- Comparison ---------- */
  table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;font-size:15px;table-layout:fixed}
  th,td{padding:15px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;word-wrap:break-word;overflow-wrap:break-word}
  thead th{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
  thead th:nth-child(2){color:var(--brand2)}
  /* fixed, consistent column widths across every comparison table:
     col 1 = 24% (30% narrower than the old 34%), cols 2 & 3 equal at 38% */
  thead th:first-child,tbody td:first-child{width:24%}
  thead th:nth-child(2),thead th:nth-child(3),tbody td:nth-child(2),tbody td:nth-child(3){width:38%}
  tbody td:first-child{font-weight:700;color:var(--ink)}
  .yn{font-weight:800}.y{color:var(--good)}.n{color:var(--warn)}
  td.nb{background:rgba(46,139,255,.06)}
  tr:last-child td{border-bottom:0}
  .cmp-wrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}

  /* ---------- Contact ---------- */
  .contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
  .field{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:13px;background:var(--panel);margin-bottom:12px}
  .field .fi{width:42px;height:42px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .field b{display:block;font-size:15px}.field span{color:var(--muted);font-size:14px}
  .qr{background:#fff;border-radius:16px;padding:20px;text-align:center;color:#0a0e1a}
  .qr .box{width:180px;height:180px;margin:0 auto 12px;background:
    repeating-conic-gradient(#0a0e1a 0% 25%,#fff 0% 50%) 0 0/22px 22px;border-radius:8px;opacity:.9}
  .qr b{color:#0a0e1a;font-size:15px}.qr span{color:#4a5a78;font-size:13px}

  .catalog-frame{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;height:80vh}
  .catalog-frame iframe{width:100%;height:100%;border:0;display:block}

  /* comparison chips + demo buttons */
  .chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:750;font-size:12.5px;
    padding:6px 11px;border-radius:99px;border:1px solid var(--brand);background:rgba(46,139,255,.12);
    color:var(--brand2);cursor:pointer;transition:.15s}
  .chip:hover{background:var(--brand);color:#03203f}
  .demo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  td.nb .yn.y{margin-right:2px}

  /* video modal */
  .vmodal{position:fixed;inset:0;z-index:100;background:rgba(3,6,14,.9);backdrop-filter:blur(6px);
    display:none;place-items:center;padding:24px}
  .vmodal.show{display:grid}
  .vmodal-box{position:relative;width:min(1000px,94vw);background:#05070e;border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .vmodal-box video{width:100%;display:block;aspect-ratio:16/9;background:#000}
  .vmodal-x{position:absolute;top:10px;right:10px;z-index:2;width:42px;height:42px;border-radius:50%;
    border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer}
  .vmodal-x:hover{background:var(--brand)}
  .vmodal-msg{padding:40px 24px;color:var(--muted);font-size:15px;text-align:center;display:none}

  /* newsroom interactive diagram */
  .nsr{margin-top:22px}
  .nsr-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .nsr-zone,.nsr-band{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:14px}
  .nsr-band{margin-top:14px}
  .nsr-zh{font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--brand2);text-transform:uppercase;margin-bottom:11px}
  .nsr-zh span{display:block;font-size:11px;font-weight:600;letter-spacing:.2px;color:var(--dim);text-transform:none;margin-top:3px}
  .nsr-node{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font:inherit;font-weight:650;font-size:14px;
    color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s}
  .nsr-node:last-child{margin-bottom:0}
  .nsr-node:hover{border-color:var(--brand);background:#17233f;transform:translateY(-1px)}
  .nsr-node .q{margin-left:auto;color:var(--brand2);font-weight:800;opacity:.7}
  .nsr-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .nsr-row .nsr-node{margin-bottom:0}
  .nsr-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .nsr-legend span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .nsr-legend i{width:22px;height:4px;border-radius:2px;display:inline-block}
  @media(max-width:900px){.nsr-cols{grid-template-columns:1fr}}
  /* real SVG diagram + clickable hotspot overlay */
  .nsr-wrap{position:relative;width:100%;margin:22px auto 0;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
  .nsr-wrap img{display:block;width:100%;height:auto;border-radius:13px}
  .nsr-hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:6px;padding:0;transition:.12s}
  .nsr-hot:hover,.nsr-hot:focus{background:rgba(46,139,255,.22);box-shadow:inset 0 0 0 2px var(--brand);outline:none}
  .nsr-hint{color:var(--dim);font-size:13px;text-align:center;margin-top:12px}
  .nsr-pop{position:fixed;z-index:120;width:280px;max-width:72vw;background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--brand);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow);pointer-events:none;opacity:0;display:none}
  .nsr-pop.show{display:block;opacity:1}
  .nsr-pop b{display:block;font-size:15px;margin-bottom:6px;color:var(--ink)}
  .nsr-pop span{color:var(--muted);font-size:13px;line-height:1.5}

  /* component info popup */
  .imodal{position:fixed;inset:0;z-index:100;background:rgba(3,6,14,.82);backdrop-filter:blur(5px);display:none;place-items:center;padding:24px}
  .imodal.show{display:grid}
  .imodal-box{position:relative;width:min(440px,92vw);background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--brand);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
  .imodal-box h3{font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-right:30px}
  .imodal-box p{color:var(--muted);font-size:15px;line-height:1.6}
  .imodal-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--panel2);color:var(--muted);font-size:15px;cursor:pointer}
  .imodal-x:hover{color:#fff;background:var(--brand)}
  .imodal-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

  footer{border-top:1px solid var(--line);margin-top:70px;padding:26px 22px;text-align:center;color:var(--dim);font-size:13px}

  /* ---------- Responsive ---------- */
  @media(max-width:900px){
    .g3,.price-grid{grid-template-columns:1fr}
    .g2,.contact-grid{grid-template-columns:1fr}
    .hero{padding:32px}
    nav{order:3;width:100%;margin-left:0}
    .arrow{transform:rotate(90deg);padding:6px 0}
    .node{min-width:100%}
  }
  @media(min-width:901px)and(max-width:1100px){.g3{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <img class="brand-logo" src="images/newblue.png" alt="NewBlue">
    <nav id="nav"></nav>
    <div class="lang" id="lang">
      <button data-l="en" class="active">EN</button>
      <button data-l="pt">PT</button>
      <button data-l="es">ES</button>
    </div>
    <img class="partner-logo" src="images/popup.png" alt="PopUp Media">
  </div>
</header>

<main id="app"><div style="padding:60px 22px;text-align:center;color:#9db0d4;font-size:15px;line-height:1.6">Loading…<br><span style="font-size:13px;color:#6b7ea6">If this message stays, open <b>index.html</b> directly in Safari. Copy the whole folder to the iPad first (not the OneDrive app preview).</span></div></main>
<noscript><div style="padding:60px 22px;text-align:center;color:#eaf1ff">This presentation needs JavaScript. Please open <b>index.html</b> in Safari on the iPad rather than a file-preview.</div></noscript>

<div id="vmodal" class="vmodal" onclick="closeVideo(event)">
  <div class="vmodal-box">
    <button class="vmodal-x" onclick="closeVideo(event,true)">✕</button>
    <video id="vmodal-vid" controls playsinline></video>
    <div id="vmodal-msg" class="vmodal-msg"></div>
  </div>
</div>

<div id="imodal" class="imodal" onclick="closeNode(event)">
  <div class="imodal-box">
    <button class="imodal-x" onclick="closeNode(event,true)">✕</button>
    <h3 class="imodal-h"></h3>
    <p class="imodal-p"></p>
    <span class="imodal-tag">NewBlue · Newsroom Ecosystem</span>
  </div>
</div>

<footer id="footer"></footer>

<script>
/* =====================================================================
   NewBlue Marketing Package — offline trilingual site
   All content lives in CONTENT[lang]. Placeholder copy = [PLACEHOLDER].
   Replace with final brief content. Videos: /videos ; images: /images
   ===================================================================== */

const CONTENT = {
  en:{

const esc = s => String(s);

function videoBlock(src, label){
  // Local video with graceful poster fallback. Drop file at videos/<src>.
  return `<div class="video">
    <video id="vid_${src.replace(/\W/g,'')}" playsinline controls preload="none" style="display:none"
      onerror="this.style.display='none';this.previousElementSibling.style.display='grid';"></video>
    <div class="poster" onclick="playVideo('${src}',this)">
      <div>
        <div class="play">▶</div>
        <div class="lbl">${esc(label)}</div>
        <small>videos/${src}</small>
      </div>
    </div>
  </div>`;
}
function openVideo(src,label){
  const m=document.getElementById('vmodal'), v=document.getElementById('vmodal-vid'), msg=document.getElementById('vmodal-msg');
  msg.style.display='none'; v.style.display='block';
  v.onerror=()=>{v.style.display='none';msg.style.display='block';
    msg.textContent='Demo clip placeholder — add videos/'+src+' to enable this demo ('+label+').';};
  v.src='videos/'+src;
  m.classList.add('show');
  v.play().catch(()=>{});
}
function closeVideo(e,force){
  if(force||(e&&e.target&&e.target.id==='vmodal')){
    const m=document.getElementById('vmodal'), v=document.getElementById('vmodal-vid');
    v.pause(); v.removeAttribute('src'); v.load(); m.classList.remove('show');
  }
}
function playVideo(src, posterEl){
  const wrap = posterEl.parentElement;
  const v = wrap.querySelector("video");
  v.src = "videos/"+src;
  v.style.display="block";
  posterEl.style.display="none";
  v.play().catch(()=>{});
}

function renderNewsroomDiagram(){

function renderStandaloneDiagram(){
  DIAG={hs:STD_HOTSPOTS,i18n:STD_I18N};
  const hot=h=>{
    const L=((h.x-STD_VB.x0)/STD_VB.w*100).toFixed(2),T=((h.y-STD_VB.y0)/STD_VB.h*100).toFixed(2),
          W=(h.w/STD_VB.w*100).toFixed(2),H=(h.h/STD_VB.h*100).toFixed(2);
    return `<button class="nsr-hot" style="left:${L}%;top:${T}%;width:${W}%;height:${H}%" onclick="openNode('${h.id}')" onmouseenter="hoverNode(event,'${h.id}')"></button>`;
  };
  return `<div class="nsr-wrap" onmouseleave="hideHover()">
    <img src="images/standalone-diagram.png" alt="NewBlue Captivate Standalone System diagram">
    ${STD_HOTSPOTS.map(hot).join('')}
    <div id="nsrpop" class="nsr-pop"></div>
  </div>
  <p class="nsr-hint">${CONTENT[lang].arch.diagramHint}</p>`;
}
function openNode(id){const n=nsrText(id); if(!n.t)return;
  const m=document.getElementById('imodal');
  m.querySelector('.imodal-h').innerHTML=n.t;
  m.querySelector('.imodal-p').textContent=n.d;
  m.classList.add('show');}
function closeNode(e,force){if(force||(e&&e.target&&e.target.id==='imodal'))document.getElementById('imodal').classList.remove('show');}
function hoverNode(e,id){
  const n=nsrText(id); if(!n.t)return;
  const b=e.currentTarget, pop=document.getElementById('nsrpop'); if(!pop)return;
  pop.innerHTML='<b>'+n.t+'</b><span>'+n.d+'</span>';
  pop.classList.add('show');                                   // show first so size can be measured
  // Position relative to the viewport (fixed) so it never resizes the page or flickers.
  const r=b.getBoundingClientRect(), pad=10;
  const popW=pop.offsetWidth, popH=pop.offsetHeight;
  const vw=window.innerWidth, vh=window.innerHeight;
  let left=r.left+r.width/2-popW/2;
  left=Math.max(pad, Math.min(left, vw-popW-pad));
  let top=(r.top-popH-10>=0) ? r.top-popH-10 : r.bottom+10;    // above if room, else below
  top=Math.max(pad, Math.min(top, vh-popH-pad));
  pop.style.left=left+'px'; pop.style.top=top+'px'; pop.style.transform='none';
}
function hideHover(){const pop=document.getElementById('nsrpop'); if(pop)pop.classList.remove('show');}

function renderArch(c){
  const a = c[archView];
  const flow = a.flow.map((n,i)=>`
    <div class="node ${i===1?'hl':''}"><div class="ni">${n[0]}</div><b>${n[1]}</b><small>${n[2]}</small></div>
    ${i<a.flow.length-1?'<div class="arrow">→</div>':''}`).join("");
  return `<div class="eyebrow">${c.eyebrow}</div><h1>${c.h1}</h1><p class="lead">${c.lead}</p>
  <div class="switch">
    <button class="${archView==='standalone'?'active':''}" onclick="setArch('standalone')">${c.opt1}</button>
    <button class="${archView==='newsroom'?'active':''}" onclick="setArch('newsroom')">${c.opt2}</button>
  </div>
  <div class="arch show">
    <div class="card" style="padding:26px">
      <h2>${a.title}</h2>
      <p class="lead" style="font-size:16px;margin-bottom:24px">${a.desc}</p>

}

const RENDER = {home:renderHome,products:renderProducts,arch:renderArch,pricing:renderPricing,catalog:renderCatalog,vs:renderVs,contact:renderContact};

function draw(){
  const c = CONTENT[lang];
  // nav
  document.getElementById("nav").innerHTML = PAGES.map(p=>
    `<button class="${p===page?'active':''}" onclick="go('${p}')">${c.nav[navKey(p)]}</button>`).join("");
  // page
  app.innerHTML = `<section class="page show">${RENDER[page](c[page])}</section>`;
  document.getElementById("footer").textContent = c.footer;
  document.documentElement.lang = lang==='pt'?'pt-BR':lang;
  window.scrollTo({top:0,behavior:'smooth'});
}
function navKey(p){return {home:"home",products:"products",arch:"arch",pricing:"pricing",catalog:"catalog",vs:"vs",contact:"contact"}[p];}
function go(p){
  if((location.hash.slice(1))===p){draw();}      // same page: just refresh/scroll up
  else{location.hash=p;}                          // new page: adds a history entry -> back works
}
function setArch(v){archView=v;draw();}
function setPrice(v){priceModel=v;draw();}
function setLang(l){lang=l;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
  draw();}

document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));

// Back/forward + iPad edge-swipe: page is driven by the URL hash (#home, #products, ...)
window.addEventListener('hashchange',()=>{
  const p = location.hash.slice(1);
  page = PAGES.includes(p) ? p : "home";
  draw();
});
page = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
draw();
</script>
